services:
  postgres:
    image: postgres:16
    container_name: audi-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: audi
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d audi"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - audi_pg_data:/var/lib/postgresql/data

volumes:
  audi_pg_data:
